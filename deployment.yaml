apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: java-app
  template:
    metadata:
      labels:
        app: java-app
    spec:
      containers:
      - name: java-app
        image: kaviya6369/java-app:latest # Use your actual username here
        ports:
        - containerPort: 8082  # Match the port in application.properties
---
apiVersion: v1
kind: Service
metadata:
  name: java-service
spec:
  type: NodePort
  selector:
    app: java-app
  ports:
    - port: 80
      targetPort: 8082        # Points to the app port
      nodePort: 30008         # This is the port you will visit in your browser